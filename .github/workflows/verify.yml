name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate web baseline
        run: |
          if [ -d WebPrototype ]; then
            echo 'GAME_DIR=WebPrototype' >> "$GITHUB_ENV"
          else
            echo 'GAME_DIR=.' >> "$GITHUB_ENV"
          fi
      - name: Verify Tuanjie project structure
        if: ${{ hashFiles('tools/verify_project.py') != '' }}
        run: python3 tools/verify_project.py
      - name: Build web baseline
        working-directory: ${{ env.GAME_DIR }}
        run: python3 tools/build.py
      - name: Verify web assets and standalone package
        working-directory: ${{ env.GAME_DIR }}
        run: python3 tools/verify_package.py
      - name: Check web JavaScript syntax
        working-directory: ${{ env.GAME_DIR }}
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < chapter-six.js
          node --check checked-standalone.mjs
      - name: Check generated web files are committed
        run: git diff --exit-code -- "$GAME_DIR/app.js" "$GAME_DIR/index.html"
