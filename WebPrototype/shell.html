<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光庭 · 水上回廊</title><style>
:root{font-family:Inter,-apple-system,"PingFang SC",sans-serif;letter-spacing:0;color:#eef6ee}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#182d36}button{font:inherit;cursor:pointer;touch-action:none}#scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}header{position:fixed;top:0;left:0;right:0;padding:25px 32px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;background:linear-gradient(#0e262b91,transparent)}h1{font-size:30px;font-weight:600;margin:0 0 4px}header span{font-size:10px;color:#c4d8d0}nav{display:flex;gap:8px;pointer-events:auto}nav button{height:36px;width:36px;border:1px solid #c9e5db55;background:#102f3780;border-radius:4px;color:#e2eee7;font-size:21px}aside{position:fixed;left:32px;top:127px;pointer-events:none;text-shadow:0 1px 7px #06181c}aside small{font-size:10px;color:#b2d0c9}aside p{font-size:16px;margin:8px 0 13px;font-weight:500}#power{display:flex;align-items:center;gap:7px;font-size:10px;color:#b4ccc6}#power i{height:5px;width:5px;background:#809892;border-radius:50%}#power.on i{background:#70e5f4;box-shadow:0 0 8px #74e2f3}#power.on{color:#b6f5fa}footer{position:fixed;bottom:0;left:0;right:0;padding:24px 32px;display:flex;align-items:end;justify-content:space-between;pointer-events:none;background:linear-gradient(transparent,#0d292fc4)}#inventory{display:flex;align-items:center;gap:15px}#orbits{display:block;width:40px;height:38px;isolation:isolate;filter:drop-shadow(0 3px 8px #041a1f99);transition:filter .3s ease}#orbits svg{display:block;width:100%;height:100%;overflow:visible}#orbits circle{mix-blend-mode:screen;transition:fill .3s ease}#orbits circle.r{fill:#43151b}#orbits circle.g{fill:#15411d}#orbits circle.b{fill:#141f45}#orbits circle.r.on{fill:#ff2b3a}#orbits circle.g.on{fill:#2bff56}#orbits circle.b.on{fill:#3a72ff}#orbits.lit{filter:drop-shadow(0 0 8px #d8f2ff66)}#inventory.active #orbits{filter:drop-shadow(0 0 10px #a8ecff77)}footer small{display:block;color:#b0cbc1;font-size:9px;margin-bottom:4px}footer b{font-size:12px;font-weight:500}#location{font-size:11px;color:#bfd4ca}#loading{position:fixed;inset:0;background:#142e38ed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}h2{font-weight:500;font-size:23px;margin:0}.track{width:220px;height:3px;background:#46616a}#loadBar{display:block;width:0;height:100%;background:#94d5d9}#loadText{font-size:11px;color:#a4c3c4}#context{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);display:none}#context button{padding:11px 25px;font-size:13px;color:#ecfffb;background:#164451e8;border:1px solid #92d3d177;border-radius:4px;white-space:nowrap}#toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);max-width:80vw;background:#123541db;color:#d2ede7;padding:10px 18px;border-left:2px solid #91cbb4;font-size:12px;opacity:0;pointer-events:none;text-align:center}#overlay{position:fixed;inset:0;background:#112c3399;display:flex;align-items:center;justify-content:center;padding:24px}#overlay section{text-align:center;max-width:430px}#overlay small{font-size:10px;color:#b7d4c6;display:block;margin-bottom:16px}#overlay h2{font-size:30px}#overlay p{font-size:13px;line-height:1.9;color:#cadbd0;margin:20px 0 26px}#overlay button,#retry{border:1px solid #b6d4bd66;border-radius:4px;padding:11px 24px;background:#d7e3d2;color:#23453f;font-size:13px}#touch{display:none;position:fixed;left:20px;right:20px;bottom:90px;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}.pad button:first-child{grid-column:2}.pad button:nth-child(n+2){grid-row:2}#touch button{width:42px;height:42px;background:#163b4899;color:#d4eee2;border:1px solid #d1ede24d;border-radius:5px;font-size:22px;pointer-events:auto}#touch #focus{width:56px;height:56px;font-size:32px}[hidden]{display:none!important}@media(pointer:coarse){#touch{display:flex}#context{bottom:205px}}@media(max-width:600px){header{padding:17px 19px}h1{font-size:25px}aside{left:19px;top:111px}aside p{font-size:14px;max-width:220px}footer{padding:20px}#location{font-size:9px}nav button{width:32px;height:32px}#overlay h2{font-size:26px}#toast{top:29%;width:80vw}}

</style><style>
#overlay button{margin:5px}
#overlay #firstRoom{background:transparent;color:#d7e3d2}
#context{max-width:calc(100vw - 32px)}
@media(max-width:600px){#overlay section{max-width:100%}#overlay button{padding:11px 17px}}

</style></head><body>
<canvas id="scene" tabindex="0" aria-label="光庭三维解谜场景"></canvas>
<header><div><h1>光庭</h1><span id="chapter">01 / 留光渡庭</span></div><nav><button id="reset" title="重新开始这一关" aria-label="重新开始">↻</button><button id="pause" title="暂停 / Escape" aria-label="暂停">Ⅱ</button></nav></header>
<aside><small>水庭的回声</small><p id="objective">寻找遗落的蓝光</p><div id="power"><i></i><span>古老机关 · 休眠</span></div></aside>
<div id="loading"><h2>光正在回到庭中</h2><div class="track"><i id="loadBar"></i></div><span id="loadText">载入神庙</span><button id="retry" hidden>重新载入</button></div>
<div id="context"><button id="interact"></button></div><div id="toast" role="status"></div>
<footer><div id="inventory"><span id="orbits" role="img" aria-label="原光色环"><svg viewBox="0 0 64 60"><circle class="r" data-bit="1" cx="32" cy="20" r="17"></circle><circle class="g" data-bit="2" cx="20" cy="39" r="17"></circle><circle class="b" data-bit="4" cx="44" cy="39" r="17"></circle></svg></span><div><small>原光</small><b id="lampState">蓝光 · 未拾取</b></div></div><span id="location">静水前庭</span></footer>
<div id="overlay" hidden><section><small id="overlayTag">行动暂停</small><h2 id="overlayTitle">光还在这里</h2><p id="overlayText"></p><button id="resume">继续探索</button><button id="again" hidden>再玩一次</button><button id="firstRoom" hidden>返回前庭</button></section></div>
<div id="touch"><div class="pad"><button data-key="KeyW" title="向前">↑</button><button data-key="KeyA" title="向左">←</button><button data-key="KeyS" title="向后">↓</button><button data-key="KeyD" title="向右">→</button></div><button id="focus" title="将蓝光朝向晶体">◎</button></div>
